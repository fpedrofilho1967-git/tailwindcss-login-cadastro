<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Entrar</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-neutral-50 min-h-screen flex items-center justify-center p-6">
  <form action="#" method="post" class="w-full sm:w-96 bg-white border border-neutral-200 rounded-xl p-8 flex flex-col gap-5">
    <div class="text-center">
      <h1 class="text-2xl font-bold text-neutral-900">Entrar</h1>
      <p class="text-sm text-neutral-500 mt-1">Acesse sua conta</p>
    </div>

    <div class="flex flex-col gap-2">
      <label for="email" class="text-sm font-medium text-neutral-700">E-mail</label>
      <input id="email" name="email" type="email" placeholder="voce@email.com" required
        class="h-10 px-3 text-sm border border-neutral-300 rounded-lg outline-none focus:border-neutral-900 placeholder:text-neutral-400">
    </div>

    <div class="flex flex-col gap-2">
      <label for="senha" class="text-sm font-medium text-neutral-700">Senha</label>
      <input id="senha" name="senha" type="password" placeholder="••••••••" required
        class="h-10 px-3 text-sm border border-neutral-300 rounded-lg outline-none focus:border-neutral-900 placeholder:text-neutral-400">
    </div>

    <button type="submit"
      class="h-10 bg-neutral-900 text-white text-sm font-medium rounded-lg cursor-pointer hover:bg-neutral-700">
      Entrar
    </button>  

    <p class="text-center text-sm text-neutral-500">
      Não tem conta?
      <a href="cadastro.html" class="font-medium text-neutral-900 hover:underline">Cadastre-se</a>
    </p>
  </form>
</body>
</html>
